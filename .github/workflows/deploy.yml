name: Build and Deploy Lister App

on:
  push:
    branches: [main]  
  workflow_dispatch:  

env:
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/lister-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/lister-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----- SETUP -----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ----- BACKEND -----
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- FRONTEND -----
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- DEPLOYMENT -----
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Create app directory
            mkdir -p /opt/lister
            cd /opt/lister

            
            # Login to Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            

            # Pull latest images (using the specific commit SHA)
            docker pull ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            docker pull ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            
            curl -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.yml

            # Download nginx config
            mkdir -p nginx
            curl -o nginx/nginx.conf https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/nginx/nginx.conf

            # Deploy with docker-compose
            docker-compose down
            docker-compose up -d

             # Update image tags in docker-compose.yml
            sed -i "s|build: ./backend|image: ${{ secrets.DOCKER_USERNAME }}/lister-backend:${{ github.sha }}|g" docker-compose.yml
            sed -i "s|build: ./frontend|image: ${{ secrets.DOCKER_USERNAME }}/lister-frontend:${{ github.sha }}|g" docker-compose.yml

            # Stop and remove old containers
            docker-compose down || true

            # Start new containers
            docker-compose up -d

            # Clean up old images
            docker image prune -f